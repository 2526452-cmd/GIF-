<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 转 GIF 转换器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用 0.9.8 版本，完全避免 SharedArrayBuffer 限制 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.9.8/dist/ffmpeg.min.js"></script>
    <style>
        .drop-zone--over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        #video-preview {
            max-height: 250px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4 md:p-8 font-sans">

    <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-10">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">MP4 转 GIF 转换器</h1>
            <p class="text-slate-500">基于浏览器的本地安全转换，保护您的隐私。</p>
        </header>

        <!-- Drop Zone -->
        <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer transition-all hover:border-blue-400 hover:bg-blue-50">
            <input type="file" id="file-input" class="hidden" accept="video/mp4,video/quicktime,video/*">
            <div id="drop-zone-content">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="text-lg font-medium text-slate-700">点击上传或将文件拖放到此处</p>
                <p class="text-sm text-slate-400 mt-1">支持 MP4, MOV 或 WEBM 格式视频</p>
            </div>
        </div>

        <!-- Settings -->
        <div id="process-section" class="hidden mt-8 space-y-6">
            <div class="bg-slate-100 rounded-lg p-4 flex justify-center overflow-hidden">
                <video id="video-preview" controls class="rounded-md shadow-sm"></video>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">帧率 (FPS / 流畅度)</label>
                    <select id="fps-select" class="w-full p-2 border border-slate-300 rounded-md outline-none">
                        <option value="10">10 FPS (文件较小)</option>
                        <option value="15" selected>15 FPS (标准推荐)</option>
                        <option value="24">24 FPS (非常流畅)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">宽度 (像素)</label>
                    <input type="number" id="width-input" value="400" class="w-full p-2 border border-slate-300 rounded-md outline-none">
                </div>
            </div>

            <button id="convert-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                转换为 GIF
            </button>
        </div>

        <!-- Progress -->
        <div id="progress-container" class="hidden mt-8 text-center">
            <div class="w-full bg-slate-200 rounded-full h-4 mb-4 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>
            <p id="progress-text" class="text-sm font-medium text-slate-600">初始化中...</p>
        </div>

        <!-- Result -->
        <div id="result-section" class="hidden mt-8 border-t pt-8 text-center">
            <h2 class="text-xl font-bold text-slate-800 mb-4">转换完成！</h2>
            <div class="flex justify-center mb-6">
                <img id="gif-result" class="rounded-lg shadow-lg max-h-80 border border-slate-200" alt="Result">
            </div>
            <div class="flex flex-col gap-3">
                <a id="download-link" href="#" download="my-animation.gif" class="inline-flex items-center justify-center px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg">
                    下载 GIF
                </a>
                <button onclick="location.reload()" class="text-sm text-blue-600 hover:underline">重新转换</button>
            </div>
        </div>

        <div id="error-box" class="hidden mt-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    
    // 回退到無需 SharedArrayBuffer 的核心版本
    const ffmpeg = createFFmpeg({ 
        log: true
    });

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
        const processSection = document.getElementById('process-section');
        const videoPreview = document.getElementById('video-preview');
        const convertBtn = document.getElementById('convert-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const resultSection = document.getElementById('result-section');
        const gifResult = document.getElementById('gif-result');
        const downloadLink = document.getElementById('download-link');
        const errorBox = document.getElementById('error-box');

        let selectedFile = null;

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drop-zone--over'); };
        dropZone.ondragleave = () => { dropZone.classList.remove('drop-zone--over'); };
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone--over');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            if (!file.type.startsWith('video/')) {
                showError("请选择有效的视频文件（MP4、MOV 等）。");
                return;
            }
            selectedFile = file;
            videoPreview.src = URL.createObjectURL(file);
            dropZone.classList.add('hidden');
            processSection.classList.remove('hidden');
            errorBox.classList.add('hidden');
        }

        convertBtn.onclick = async () => {
            convertBtn.disabled = true;
            processSection.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            
            try {
                if (!ffmpeg.isLoaded()) {
                    progressText.innerText = "正在加载转换引擎（首次加载可能需要一些时间）...";
                    await ffmpeg.load();
                }

                const name = 'input_video';
                ffmpeg.FS('writeFile', name, await fetchFile(selectedFile));

                ffmpeg.setProgress(({ ratio }) => {
                    const percent = Math.max(0, Math.min(100, Math.round(ratio * 100)));
                    progressBar.style.width = percent + '%';
                    progressText.innerText = `转换中: ${percent}%`;
                });

                const width = document.getElementById('width-input').value || 400;
                const fps = document.getElementById('fps-select').value;

                // Simple high-quality GIF command
                await ffmpeg.run(
                    '-i', name, 
                    '-vf', `fps=${fps},scale=${width}:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse`, 
                    'output.gif'
                );

                const data = ffmpeg.FS('readFile', 'output.gif');
                const url = URL.createObjectURL(new Blob([data.buffer], { type: 'image/gif' }));

                gifResult.src = url;
                downloadLink.href = url;
                progressContainer.classList.add('hidden');
                resultSection.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                showError("兼容性错误或转换失败: " + err.message);
                progressContainer.classList.add('hidden');
                processSection.classList.remove('hidden');
                convertBtn.disabled = false;
            }
        };

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
