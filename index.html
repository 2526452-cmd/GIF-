<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 转 GIF 转换器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用最新 v0.12 版本，原生支援無 SharedArrayBuffer 環境且記憶體管理更好 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <style>
        .drop-zone--over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        #video-preview {
            max-height: 250px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4 md:p-8 font-sans">

    <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl p-5 md:p-10">
        <header class="text-center mb-6 md:mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">MP4 转 GIF 转换器</h1>
            <p class="text-sm md:text-base text-slate-500">基于浏览器的本地安全转换，保护您的隐私。</p>
            <!-- 專屬作者標籤 -->
            <div class="mt-4">
                <span class="inline-flex items-center justify-center px-3 py-1 bg-blue-50 text-blue-600 text-xs font-semibold rounded-full border border-blue-200 shadow-sm">
                    ✨ 由 涂 製作
                </span>
            </div>
        </header>

        <!-- Drop Zone -->
        <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-6 md:p-8 text-center cursor-pointer transition-all hover:border-blue-400 hover:bg-blue-50 active:bg-blue-100">
            <input type="file" id="file-input" class="hidden" accept="video/*,.mp4,.mov,.avi,.mkv,.webm,.flv,.wmv,.m4v,.3gp,.mpeg,.mpg">
            <div id="drop-zone-content">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 md:h-12 md:w-12 mx-auto text-blue-500 md:text-slate-400 mb-3 md:mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="text-lg font-medium text-blue-600 md:text-slate-700">点击上传视频</p>
                <p class="hidden md:block text-sm text-slate-400 mt-1">或将文件拖放到此处</p>
                <p class="text-xs md:text-sm text-slate-400 mt-2">支持所有常见视频格式</p>
            </div>
        </div>

        <!-- Settings -->
        <div id="process-section" class="hidden mt-6 md:mt-8 space-y-6">
            <div class="bg-slate-100 rounded-lg p-3 md:p-4 flex justify-center overflow-hidden">
                <video id="video-preview" controls class="rounded-md shadow-sm max-w-full"></video>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">帧率 (FPS / 流畅度)</label>
                    <select id="fps-select" class="w-full p-3 md:p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="10">10 FPS (文件较小)</option>
                        <option value="15" selected>15 FPS (标准推荐)</option>
                        <option value="24">24 FPS (非常流畅)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">宽度 (像素)</label>
                    <input type="number" id="width-input" value="400" class="w-full p-3 md:p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <button id="convert-btn" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-4 md:py-3 px-6 rounded-xl transition-colors shadow-md">
                转换为 GIF
            </button>
        </div>

        <!-- Progress -->
        <div id="progress-container" class="hidden mt-8 text-center">
            <div class="w-full bg-slate-200 rounded-full h-4 mb-4 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>
            <p id="progress-text" class="text-sm font-medium text-slate-600">初始化中...</p>
        </div>

        <!-- Result -->
        <div id="result-section" class="hidden mt-8 border-t pt-8 text-center">
            <h2 class="text-xl font-bold text-slate-800 mb-4">转换完成！</h2>
            <div class="flex justify-center mb-6">
                <img id="gif-result" class="rounded-lg shadow-lg max-h-80 max-w-full border border-slate-200" alt="Result">
            </div>
            <div class="flex flex-col gap-4 md:gap-3">
                <a id="download-link" href="#" download="my-animation.gif" class="inline-flex items-center justify-center px-6 py-4 md:py-3 bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-bold rounded-xl shadow-md">
                    下载 GIF
                </a>
                <button onclick="location.reload()" class="text-sm text-blue-600 hover:underline py-2">重新转换</button>
            </div>
        </div>

        <div id="error-box" class="hidden mt-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>
    </div>

<script>
    // 移除先前的 hack，改用全新的 FFmpeg v12 API
    const { FFmpeg } = window.FFmpegWASM;
    const { fetchFile, toBlobURL } = window.FFmpegUtil; // 引入 toBlobURL 解決跨域問題
    
    const ffmpeg = new FFmpeg();

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const processSection = document.getElementById('process-section');
    const videoPreview = document.getElementById('video-preview');
    const convertBtn = document.getElementById('convert-btn');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const resultSection = document.getElementById('result-section');
    const gifResult = document.getElementById('gif-result');
    const downloadLink = document.getElementById('download-link');
    const errorBox = document.getElementById('error-box');

    let selectedFile = null;

    // v12 版本的進度監聽寫法
    ffmpeg.on('progress', ({ progress }) => {
        const percent = Math.max(0, Math.min(100, Math.round(progress * 100)));
        progressBar.style.width = percent + '%';
        progressText.innerText = `转换中: ${percent}%`;
    });

    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drop-zone--over'); };
    dropZone.ondragleave = () => { dropZone.classList.remove('drop-zone--over'); };
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('drop-zone--over');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    };

    fileInput.onchange = (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    };

    function handleFile(file) {
        const isVideoMime = file.type.startsWith('video/');
        const isVideoExt = file.name.match(/\.(mp4|mov|avi|mkv|webm|flv|wmv|m4v|3gp|mpeg|mpg)$/i);
        
        if (!isVideoMime && !isVideoExt) {
            showError("请选择有效的视频文件。");
            return;
        }
        selectedFile = file;
        videoPreview.src = URL.createObjectURL(file);
        dropZone.classList.add('hidden');
        processSection.classList.remove('hidden');
        errorBox.classList.add('hidden');
    }

    convertBtn.onclick = async () => {
        convertBtn.disabled = true;
        processSection.classList.add('hidden');
        progressContainer.classList.remove('hidden');
        
        try {
            // v12 版本的初始化與核心載入
            if (!ffmpeg.loaded) {
                progressText.innerText = "正在加载全新转换引擎（首次加载需几秒钟）...";
                
                // 定義 CDN 基礎路徑
                const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                const ffmpegURL = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd';

                // 使用 toBlobURL 將跨域腳本轉換為本地 Blob，完美繞過浏览器的 Worker 跨域安全限制
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                    classWorkerURL: await toBlobURL(`${ffmpegURL}/814.ffmpeg.js`, 'text/javascript')
                });
            }

            // 抓取副檔名，幫助引擎更準確辨識各種格式 (AVI, MKV 等)
            const ext = selectedFile.name.substring(selectedFile.name.lastIndexOf('.'));
            const name = 'input_video' + (ext || '.mp4');
            
            progressText.innerText = "正在读取文件...";
            await ffmpeg.writeFile(name, await fetchFile(selectedFile));

            const width = document.getElementById('width-input').value || 400;
            const fps = document.getElementById('fps-select').value;

            progressText.innerText = "开始处理视频...";
            
            // v12 版本的執行語法 (exec)
            await ffmpeg.exec([
                '-i', name, 
                '-vf', `fps=${fps},scale=${width}:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse`, 
                'output.gif'
            ]);

            const data = await ffmpeg.readFile('output.gif');
            const url = URL.createObjectURL(new Blob([data.buffer], { type: 'image/gif' }));

            gifResult.src = url;
            downloadLink.href = url;
            progressContainer.classList.add('hidden');
            resultSection.classList.remove('hidden');

        } catch (err) {
            console.error(err);
            showError("兼容性错误或转换失败: " + err.message);
            progressContainer.classList.add('hidden');
            processSection.classList.remove('hidden');
            convertBtn.disabled = false;
        }
    };

    function showError(msg) {
        errorBox.innerText = msg;
        errorBox.classList.remove('hidden');
    }
</script>
</body>
</html>
